name: CraftDeja Development Tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: development-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified WoWLua
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'wowlua-v0.13.14-x86_64-pc-windows-msvc.zip'
          $zip = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest "https://github.com/DomenikIrrgang/wowlua/releases/download/v0.13.14/$name" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne 'B0B605C278B02661E5FF489122F045BA10A4ECAB101D76DE31F0CBF5182E1CC8') {
            throw 'WoWLua checksum mismatch'
          }
          $bin = Join-Path $env:USERPROFILE '.wowlua/bin'
          Expand-Archive -LiteralPath $zip -DestinationPath $bin -Force
          $exe = Get-ChildItem $bin -Filter wowlua.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'WoWLua missing' }
          $exe.Directory.FullName >> $env:GITHUB_PATH

      - name: Build and run all regression tests
        shell: pwsh
        run: |
          ./tools/Test-CraftDeja.ps1 -Profile release -Evidence
          if ($LASTEXITCODE -ne 0) {
            throw 'CraftDeja tests failed'
          }

      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: craftdeja-tests-${{ github.run_id }}
          path: reports/tests/
          retention-days: 30
          if-no-files-found: warn